apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: local-platform-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: platform
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: local-platform-credentials
    creationPolicy: Owner
  data:
    - secretKey: grafana-password
      remoteRef:
        key: hyperscale/platform
        property: grafanaPassword
