{{- if .Values.vault.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
---
# Lets Vault call TokenReview to validate client JWTs for kubernetes auth.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: {{ .Values.global.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
data:
  vault.hcl: |
    storage "file" {
      path = "/vault/data"
    }
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }
    api_addr      = "http://vault.{{ .Values.global.namespace }}.svc:8200"
    disable_mlock = true
    ui            = true
  # Runs in the vault-init sidecar. First boot: initializes Vault and stores the
  # unseal key + root token in init.json on the PVC (cluster-local only, never
  # committed). Then auto-unseals whenever sealed and performs the one-time
  # bootstrap: kubernetes auth, eso policy/role, and seeding any missing KV
  # secrets. Seeds adopt values from existing Kubernetes Secrets when present
  # (SEED_* env vars) so migrating off a previous secret source does not rotate
  # credentials; otherwise random values are generated.
  init.sh: |
    #!/bin/sh
    set -e
    export VAULT_ADDR="http://127.0.0.1:8200"
    DATA=/vault/data
    INIT=$DATA/init.json
    FLAG=$DATA/.bootstrapped

    echo "Waiting for Vault API..."
    until vault status 2>/dev/null | grep -q "Initialized"; do sleep 2; done

    if [ ! -f "$INIT" ]; then
      echo "Initializing Vault..."
      vault operator init -key-shares=1 -key-threshold=1 > "$INIT"
      chmod 600 "$INIT"
    fi

    UNSEAL_KEY=$(awk '/Unseal Key 1/{print $NF}' "$INIT")
    export VAULT_TOKEN=$(awk '/Initial Root Token/{print $NF}' "$INIT")

    gen() { head -c 24 /dev/urandom | base64 | tr -d '\n'; }

    while true; do
      SEALED=$(vault status 2>/dev/null | awk '/^Sealed/{print $2}')
      if [ "$SEALED" = "true" ]; then
        vault operator unseal "$UNSEAL_KEY" || true
        sleep 2
        continue
      fi
      if [ ! -f "$FLAG" ] && [ "$SEALED" = "false" ]; then
        vault secrets enable -path=secret kv-v2 2>/dev/null || true
        vault auth enable kubernetes 2>/dev/null || true
        vault write auth/kubernetes/config \
          kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
        vault policy write eso - <<'EOF'
    path "secret/data/hyperscale/*" {
      capabilities = ["read"]
    }
    EOF
        vault write auth/kubernetes/role/eso \
          bound_service_account_names=vault-auth \
          bound_service_account_namespaces="$VAULT_NAMESPACE_NAME" \
          policies=eso ttl=1h
        vault kv get secret/hyperscale/postgres >/dev/null 2>&1 || \
          vault kv put secret/hyperscale/postgres \
            password="${SEED_POSTGRES_PASSWORD:-$(gen)}" \
            replicatorPassword="${SEED_REPLICATOR_PASSWORD:-$(gen)}"
        vault kv get secret/hyperscale/redis >/dev/null 2>&1 || \
          vault kv put secret/hyperscale/redis \
            password="${SEED_REDIS_PASSWORD:-$(gen)}"
        vault kv get secret/hyperscale/platform >/dev/null 2>&1 || \
          vault kv put secret/hyperscale/platform \
            grafanaPassword="${SEED_GRAFANA_PASSWORD:-$(gen)}"
        touch "$FLAG"
        echo "Bootstrap complete."
      fi
      sleep 15
    done
---
apiVersion: v1
kind: Service
metadata:
  name: vault-headless
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 8200
      targetPort: 8200
  selector:
    app.kubernetes.io/component: vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
spec:
  ports:
    - name: http
      port: 8200
      targetPort: 8200
  selector:
    app.kubernetes.io/component: vault
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
spec:
  serviceName: vault-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperscale-commerce
        app.kubernetes.io/component: vault
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: "{{ .Values.vault.image.repository }}:{{ .Values.vault.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - server
          env:
            - name: SKIP_SETCAP
              value: "true"
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
          volumeMounts:
            # subPath: the entrypoint adds -config=/vault/config itself, so the
            # directory must contain only vault.hcl — a full-directory mount
            # would also expose init.sh as invalid config and load vault.hcl
            # twice (duplicate listener bind error).
            - name: vault-config
              mountPath: /vault/config/vault.hcl
              subPath: vault.hcl
            - name: vault-data
              mountPath: /vault/data
        - name: vault-init
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: "{{ .Values.vault.image.repository }}:{{ .Values.vault.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: [/bin/sh, /vault/scripts/init.sh]
          env:
            - name: VAULT_NAMESPACE_NAME
              value: {{ .Values.global.namespace | quote }}
            # Adopt existing secrets on first seed so no rotation is needed
            # when migrating; optional so a clean environment still works.
            - name: SEED_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
                  optional: true
            - name: SEED_REPLICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: replicator-password
                  optional: true
            - name: SEED_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
                  optional: true
            - name: SEED_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: local-platform-credentials
                  key: grafana-password
                  optional: true
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
          volumeMounts:
            - name: vault-config
              mountPath: /vault/scripts/init.sh
              subPath: init.sh
            - name: vault-data
              mountPath: /vault/data
      volumes:
        - name: vault-config
          configMap:
            name: vault-config
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.vault.storage.size }}
{{- end }}
