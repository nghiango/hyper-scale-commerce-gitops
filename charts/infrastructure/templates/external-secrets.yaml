{{- if .Values.vault.enabled }}
# Identity that ESO uses to log in to Vault via kubernetes auth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-auth-token
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
  annotations:
    kubernetes.io/service-account.name: vault-auth
type: kubernetes.io/service-account-token
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: vault
spec:
  provider:
    vault:
      server: "http://vault.{{ .Values.global.namespace }}.svc:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          secretRef:
            name: vault-auth-token
            key: token
            namespace: {{ .Values.global.namespace }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: postgres-ha
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: hyperscale/postgres
        property: password
    - secretKey: replicator-password
      remoteRef:
        key: hyperscale/postgres
        property: replicatorPassword
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hyperscale-commerce
    app.kubernetes.io/component: redis
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: redis-secret
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: hyperscale/redis
        property: password
{{- end }}
