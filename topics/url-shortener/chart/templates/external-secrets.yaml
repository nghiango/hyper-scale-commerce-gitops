{{- $ns := include "topic.namespace" . }}
# Shared credentials copied from Vault (via the existing ClusterSecretStore)
# into the topic namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "topic.labels" . | nindent 4 }}
  annotations:
    {{- include "topic.wave" "-2" | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- include "topic.labels" . | nindent 10 }}
  data:
    - secretKey: password
      remoteRef:
        key: hyperscale/postgres
        property: password
{{- if .Values.redis.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: {{ $ns }}
  labels:
    {{- include "topic.labels" . | nindent 4 }}
  annotations:
    {{- include "topic.wave" "-2" | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: redis-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- include "topic.labels" . | nindent 10 }}
  data:
    - secretKey: redis-password
      remoteRef:
        key: hyperscale/redis
        property: password
{{- end }}
