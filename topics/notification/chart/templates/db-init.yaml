{{- if .Values.database.enabled }}
{{- $db := include "topic.dbName" . }}
# Create this topic's database on the shared Postgres cluster if it is missing.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: {{ include "topic.namespace" . }}
  labels:
    {{- include "topic.labels" . | nindent 4 }}
  annotations:
    {{- include "topic.hook" "0" | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "topic.labels" . | nindent 8 }}
        system-design/job: db-init
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: {{ .Values.postgres.clientImage | quote }}
          env:
            - {name: PGHOST, value: {{ .Values.postgres.host | quote }}}
            - {name: PGPORT, value: {{ .Values.postgres.port | quote }}}
            - {name: PGUSER, value: {{ .Values.postgres.adminUser | quote }}}
            - {name: PGDATABASE, value: {{ .Values.postgres.adminDatabase | quote }}}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: password}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              if psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ $db }}'" | grep -q 1; then
                echo "database {{ $db }} already exists"
              else
                psql -c 'CREATE DATABASE "{{ $db }}"'
              fi
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
{{- end }}
